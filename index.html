<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<title>BC Sail</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0a0f14;--panel:rgba(18,24,30,.94);--panel2:#151c23;--line:rgba(255,255,255,.09);--txt:#eef3f6;--mut:#8e9aa5;--acc:#9ccc65;--acc2:#5f7f45;--ok:#66bb6a;--warn:#ffb300;--bad:#ef5350}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0;background:#0b1620}
  .leaflet-container{background:#0b1620}
  /* top */
  .top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:8px;align-items:stretch;pointer-events:none}
  .top>*{pointer-events:auto}
  .seg{display:flex;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px)}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:11px 4px;font:600 14px system-ui;cursor:pointer}
  .seg button.on{background:linear-gradient(#6f8f55,#56743f);color:#fff}
  .sq{width:46px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .sq .dots{position:absolute;bottom:5px;display:flex;gap:3px}
  .dot{width:6px;height:6px;border-radius:50%;background:#555;display:inline-block}
  .dot.ok{background:var(--ok)}.dot.load{background:var(--warn);animation:p 1s infinite}.dot.bad{background:var(--bad)}.dot.stale{background:#ff8a65}
  @keyframes p{50%{opacity:.3}}
  .row2{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 66px);left:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
  .pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:600 13px system-ui}
  .pill .ldot{width:9px;height:9px;border-radius:50%;background:#d4b13a}
  #scale{pointer-events:none;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  #scale .bar{height:6px;width:150px;border-radius:3px}
  #scale .lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
  #legendImg{background:rgba(255,255,255,.9);border-radius:8px;max-height:38vh;display:block}
  #menu{position:absolute;z-index:1100;top:calc(env(safe-area-inset-top) + 66px);right:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:220px}
  #menu.open{display:block}
  #menu label{display:flex;align-items:center;gap:10px;padding:10px;font-size:14px}
  #menu input{width:18px;height:18px;accent-color:#7cb342}
  #menu .st{border-top:1px solid var(--line);margin-top:4px;padding:8px 10px 4px;font-size:12px;color:var(--mut);display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
  /* crosshair */
  #cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:600;pointer-events:none;opacity:.75}
  /* fab */
  .fab{position:absolute;right:10px;z-index:1000;bottom:calc(env(safe-area-inset-bottom) + 215px);display:flex;flex-direction:column;gap:10px}
  .fab button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px}
  /* bottom timeline */
  .bottom{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:6px 10px calc(env(safe-area-inset-bottom) + 10px);backdrop-filter:blur(10px)}
  .grab{width:38px;height:4px;border-radius:2px;background:#3a444d;margin:0 auto 8px}
  .tl-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .tl-top button{background:#1d262e;border:1px solid var(--line);color:var(--txt);border-radius:10px;height:44px;min-width:44px;font:600 14px system-ui;padding:0 12px}
  .tl-top button.now{color:#8fd3ff}
  .sum{flex:1;min-width:0}
  .sum b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sum small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .strip2{position:relative;height:30px;border-radius:6px;overflow:visible}
  #bars{display:flex;height:100%;border-radius:6px;overflow:hidden;background:#1d262e}
  #bars div{flex:1;display:flex;align-items:center;justify-content:center;font:700 11px system-ui;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.7);overflow:visible;white-space:nowrap}
  #slider{position:absolute;inset:-8px 0;width:100%;height:46px;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
  #slider::-webkit-slider-runnable-track{background:transparent;height:46px}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:8px;border-radius:50%;background:#fff;border:3px solid #1d262e;box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.6)}
  #slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #1d262e}
  #days{position:relative;height:18px;margin-top:4px;font:600 11px system-ui;color:var(--mut)}
  #days span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  #days span.d{color:var(--txt)}
  #tideRow{position:relative;height:40px;margin-top:6px;border-radius:6px;background:#141b21;overflow:hidden}
  #tideRow svg{position:absolute;inset:0;width:100%;height:100%}
  #tideRow .tv{position:absolute;transform:translateX(-50%);font:700 10px system-ui;color:#cfe7f5;text-shadow:0 0 3px #000;pointer-events:none}
  #tideRow .tv.lo{color:#9fb3c1}
  #tideRow .tlab{position:absolute;right:6px;bottom:3px;font:600 10px system-ui;color:#7fb6d3;background:rgba(20,27,33,.7);padding:0 3px;border-radius:3px}
  #sumTide{color:#9fd3ef!important}
  #sumSea{color:#d7e4ec!important}
  .corr{display:inline-block;vertical-align:middle;font:700 10px system-ui;color:#c5e1a5;border:1px solid #6f8f55;border-radius:6px;padding:1px 5px;margin-left:2px}
  #sumSea .sv{font-weight:700}
  #sumSea[hidden]{display:none}
  .row3{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 118px);left:10px;right:10px;display:flex;gap:8px;align-items:stretch;pointer-events:none}
  .row3>*{pointer-events:auto}
  .subseg{flex:none}
  .subseg[hidden]{display:none}
  .mchip{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--txt);font:600 12px system-ui;text-align:left}
  .mchip[hidden]{display:none}
  .mchip b{font-size:13px;white-space:nowrap}
  .mchip span{color:var(--mut);font-weight:500;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mchip.warn{background:rgba(120,72,0,.92);border-color:#ffb300}
  .mchip.warn span{color:#ffe0a3}
  .mchip.storm{background:rgba(130,20,20,.92);border-color:#ef5350}
  .mchip.storm span{color:#ffc9c9}
  .mwarn{margin:0 14px 8px;padding:10px 12px;border-radius:10px;background:rgba(120,72,0,.6);border:1px solid #ffb300;font-weight:700}
  .mloc{margin:6px 14px;padding:10px 12px;border-radius:12px;background:#1b232b;border:1px solid var(--line)}
  .mloc b{display:block;font-size:14px}
  .mloc small{color:var(--mut)}
  .mloc p{margin:8px 0 0;font-size:13px;line-height:1.45}
  .mk{display:inline-block;min-width:62px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .subseg button{padding:8px 14px;font-size:13px}
  #sumTide .tst{color:var(--mut)}
  .tw{color:#4fc3f7;font-size:10px}
  .tide{display:flex;align-items:center;gap:2px;font:700 11px system-ui;color:#d9f1ff;background:rgba(15,40,58,.85);border:1px solid #2b6c8f;border-radius:7px;padding:1px 5px;white-space:nowrap;width:max-content}
  .tide small{font-weight:500;color:#8fb7cc;margin-left:1px}
  .tide.dim{opacity:.6}
  #note{font-size:11px;color:var(--warn);text-align:center;margin-top:2px;min-height:0}
  /* sheet */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:2000;background:var(--panel2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:74vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding:6px 0 calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -8px 30px rgba(0,0,0,.55)}
  #sheet.open{transform:none}
  .sh-head{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;position:sticky;top:-6px;background:var(--panel2);z-index:2}
  .sh-head h2{font-size:17px;margin:2px 0 0;flex:1}
  .sh-head small{color:var(--mut);font-weight:400;display:block;font-size:12px}
  .x{background:#232d36;border:0;color:var(--txt);border-radius:10px;width:36px;height:36px;font-size:16px}
  .sec-t{padding:10px 14px 4px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
  .strip{overflow-x:auto;padding:0 14px 6px}
  .strip table{border-collapse:collapse;font-size:12px}
  .strip td,.strip th{text-align:center;min-width:34px;padding:3px 1px;white-space:nowrap}
  .strip th{color:var(--mut);font-weight:500}
  .strip .day th{color:var(--txt);text-align:left;font-weight:700;padding-top:2px}
  .strip .day th.d{border-left:2px solid var(--line);padding-left:4px}
  .strip td.d{border-left:2px solid var(--line)}
  .strip td.now{outline:2px solid #fff;outline-offset:-2px}
  .rowlab{position:sticky;left:-14px;background:var(--panel2);color:var(--mut);text-align:left!important;padding-right:6px!important;font-size:11px;min-width:44px!important;z-index:1}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}
  .kv div{background:#1b232b;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .kv b{display:block;font-size:21px}
  .kv span{color:var(--mut);font-size:11px}
  .ev{padding:0 14px}
  .ev div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0}
  .ev .f{color:#81d4fa}.ev .e{color:#ffcc80}.ev .s{color:var(--mut)}
  .err{color:var(--bad);padding:4px 14px;font-size:12px}
  .muted{color:var(--mut);font-size:12px;padding:2px 14px}
  canvas.spark{width:calc(100% - 28px);margin:0 14px;height:90px;display:block}
  /* markers */
  .obs{display:flex;align-items:center;gap:3px;white-space:nowrap;font:700 12px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  .obs .pin{width:9px;height:9px;border-radius:50%;background:#7cb342;border:2px solid #fff;flex:none}
  .cur{font:700 11px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;display:flex;align-items:center;gap:2px}
  .leaflet-control-attribution{font-size:9px;background:rgba(10,15,20,.6)!important;color:#9aa!important}
  .leaflet-control-attribution a{color:#9cc!important}
  .leaflet-bottom{bottom:calc(env(safe-area-inset-bottom) + 192px)}
  .tapmark{width:14px;height:14px;border:3px solid #fff;border-radius:50%;background:#7cb342;box-shadow:0 0 0 2px #000}
  .flowcv{position:absolute;left:0;top:0;pointer-events:none}
  .surfpin{display:flex;flex-direction:column;align-items:center;background:rgba(18,24,30,.92);border:2px solid #5b6670;border-radius:10px;padding:2px 6px;width:max-content;margin:0 auto;font:600 10px system-ui;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .surfpin b{font-size:13px}
  .surfpin span{font-size:10px;letter-spacing:-1px}
  .surfpin small{color:#9fb3c1;font-size:9px;white-space:nowrap}
  .surfpin.sm{flex-direction:row;gap:4px;padding:1px 6px;border-radius:8px;text-shadow:0 0 2px rgba(0,0,0,.6)}
  .surfpin.sm b{font-size:11px}
  .surfpin.sm span{font-size:10px;letter-spacing:0}
  #install{position:absolute;z-index:1500;left:10px;right:70px;bottom:calc(env(safe-area-inset-bottom) + 215px);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #install[hidden]{display:none}
  #install img{width:40px;height:40px;border-radius:10px;flex:none}
  #install .itxt{flex:1;min-width:0}
  #install .itxt b{display:block;font-size:14px}
  #install .itxt span{display:block;font-size:12px;color:var(--mut)}
  #btnInstall{background:linear-gradient(#6f8f55,#56743f);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:700 14px system-ui;flex:none}
  #install .ix{background:none;border:0;color:var(--mut);font-size:16px;padding:6px;flex:none}
  .basemap{filter:brightness(1.3) contrast(1.1)}
</style>
</head>
<body>
<div id="map"></div>
<svg id="cross" viewBox="0 0 22 22"><circle cx="11" cy="11" r="4" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M11 0v6M11 16v6M0 11h6M16 11h6" stroke="#fff" stroke-width="1.5"/></svg>

<div class="top">
  <div class="seg" id="layerSeg">
    <button data-l="windtop" class="on">Wind</button>
    <button data-l="current">Current</button>
    <button data-l="water">Water</button>
    <button data-l="surf">Surf</button>
  </div>
  <div class="sq" id="btnMenu" title="Layers">≡<div class="dots"><span class="dot" id="sMap"></span><span class="dot" id="sObs"></span><span class="dot" id="sCur"></span></div></div>
</div>
<div class="row2">
  <div class="pill" id="modelPill"><span class="ldot"></span><span id="modelName">HRDPS 2.5 km</span></div>
  <div id="scale"><div class="bar" id="scaleBar"></div><div class="lbl" id="scaleLbl"></div></div>
</div>
<div class="row3"><div class="seg subseg" id="windSeg" hidden><button data-w="wind" class="on">Sustained</button><button data-w="gust">Gusts</button></div><div class="seg subseg" id="waterSeg" hidden><button data-w="waves" class="on">Waves</button><button data-w="temp">Temp</button></div><button id="marineChip" class="mchip" hidden></button></div>
<div id="menu">
  <label><input type="checkbox" id="tFlow" checked>Animated flow lines</label>
  <label><input type="checkbox" id="tObs" checked>Observed wind (stations)</label>
  <label><input type="checkbox" id="tCorr" checked>Correct forecast with live stations</label>
  <label><input type="checkbox" id="tTide" checked>Tide heights (zoom in)</label>
  <label><input type="checkbox" id="tCur" checked>Tidal current stations</label>
  <label><input type="checkbox" id="tSea">Seamarks (OpenSeaMap)</label>
  <div class="st"><span class="dot" id="sMap2"></span><span id="sMapT">Forecast grid</span><span class="dot" id="sObs2"></span><span id="sObsT">Observations</span><span class="dot" id="sCur2"></span><span id="sCurT">Tide &amp; current stations</span></div>
</div>

<div class="fab">
  <button id="btnHome" title="Comox / Little River">⌂</button>
  <button id="btnLoc" title="My location">➤</button>
  <button id="btnRefresh" title="Refresh data">⟳</button>
</div>

<div class="bottom">
  <div class="grab"></div>
  <div class="tl-top">
    <button id="btnPlay" aria-label="Play">▶</button>
    <div class="sum"><b id="sumMain">—</b><small id="sumSub">Wind at map centre</small><small id="sumSea" hidden></small><small id="sumTide"></small></div>
    <button id="btnNow" class="now">Now</button>
  </div>
  <div class="strip2"><div id="bars"></div><input type="range" id="slider" min="0" max="48" value="0" step="1"></div>
  <div id="tideRow"></div>
  <div id="days"></div>
  <div id="note"></div>
</div>

<div id="install" hidden>
  <img src="icon-192.png" alt="">
  <div class="itxt"><b>Install BC Sail</b><span id="installMsg">Full-screen app on your home screen, works with patchy signal.</span></div>
  <button id="btnInstall">Install</button>
  <button id="btnInstallX" class="ix" aria-label="Not now">✕</button>
</div>
<div id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
"use strict";
/* ============ config ============ */
const TZ = "America/Vancouver";
const GEOMET = "https://geo.weather.gc.ca/geomet";
const IWLS = "https://api-iwls.dfo-mpo.gc.ca/api/v1";
const OGC = "https://api.weather.gc.ca/collections";
const KMH2KT = 1/1.852, MS2KT = 1.943844;
const SALISH = {s:47.0,n:51.0,w:-126.4,e:-122.0}; // approx CIOPS-SalishSea footprint
const COAST = {s:47.0,n:56.0,w:-136.0,e:-121.5};
const HOURS = 48;

/* ============ small utils ============ */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
async function fetchJSON(url, {timeout=12000, tries=3, text=false, buffer=false}={}){
  let last;
  for(let i=0;i<tries;i++){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(url, {signal:ctl.signal});
      clearTimeout(t);
      if(r.status===429){ await sleep(1500*(i+1)); last = new Error("rate limited"); continue; }
      if(!r.ok) throw new Error("HTTP "+r.status);
      return buffer ? await r.arrayBuffer() : text ? await r.text() : await r.json();
    }catch(e){ clearTimeout(t); last = e; await sleep(600*(i+1)); }
  }
  throw last;
}
const fmtTime = (d, o={hour:"numeric"}) => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,...o}).format(d);
const fmtDay = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,weekday:"short",day:"numeric"}).format(d);
const localDayKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
const localHour = d => +new Intl.DateTimeFormat("en-CA",{timeZone:TZ,hour:"numeric",hourCycle:"h23"}).format(d);
const isoZ = d => d.toISOString().slice(0,19)+"Z";
const compass = deg => ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(((deg%360)+360)%360/22.5)%16];
function setDot(id, state, title){
  for(const el of [$(id), $(id+"2")]) if(el){ el.className="dot "+state; if(title) el.title=title; }
  const t = $(id+"T"); if(t && title) t.textContent = title;
}
/* colour scales */
function ramp(stops, v){
  if(v<=stops[0][0]) return stops[0][1];
  for(let i=1;i<stops.length;i++){ if(v<=stops[i][0]){ const [a,ca]=stops[i-1],[b,cb]=stops[i]; const f=(v-a)/(b-a); return ca.map((c,k)=>Math.round(c+(cb[k]-c)*f)); } }
  return stops.at(-1)[1];
}
const WIND_STOPS = [[0,[70,90,170]],[5,[50,140,200]],[9,[60,170,120]],[13,[140,195,60]],[17,[230,200,40]],[22,[240,140,30]],[27,[220,70,40]],[33,[190,40,90]],[42,[130,40,150]]];
const CUR_STOPS  = [[0,[40,70,130]],[0.5,[40,120,200]],[1,[40,180,190]],[2,[90,200,110]],[3,[220,210,60]],[4.5,[240,130,40]],[6,[220,50,60]],[8,[170,40,140]]];
const WAVE_STOPS = [[0,[40,60,125]],[0.4,[40,115,190]],[0.8,[45,165,175]],[1.2,[100,195,100]],[1.8,[225,205,60]],[2.5,[240,135,40]],[3.5,[215,55,60]],[5,[160,40,140]]];
const TEMP_STOPS = [[4,[70,45,150]],[6,[50,95,195]],[8,[40,160,205]],[10,[65,190,145]],[12,[185,205,70]],[14,[240,150,40]],[16,[220,65,50]],[20,[170,30,60]]];
const STYLES = {
  wind:   {stops:WIND_STOPS, min:0, max:40, alpha:85,  k:0.16, div:170, lw:1.3, unit:"kt", particles:true},
  current:{stops:CUR_STOPS,  min:0, max:6,  alpha:150, k:2.2,  div:140, lw:1.6, unit:"kt", particles:true, minMag:0.04},
  waves:  {stops:WAVE_STOPS, min:0, max:4,  alpha:150, k:0.18, div:700, lw:1.9, unit:"m",  particles:true, minMag:0.05},

async function wcs(cov, box, time){

function modelFor(layer){

    const {g, box} = req;

    if(g.b) jobs.push(wcs(g.b, box, time)); else jobs.push(null);
    if(g.c) jobs.push(wcs(g.c, box, time)); else jobs.push(null);
    if(req.gust) jobs.push(wcs(GRIDS.gust.a, box, time)); else jobs.push(null);

const maskCache = new Map();
function loadMask(box){ // 1 = water, 0 = land; uses the finest CIOPS grid for the area

function fillLand(w, h, arrs, key, passes=40){ // grow water values into land (NaN) cells; land is drawn on top anyway

function sampleField(f, lat, lon){

  const ids = [i, i+1, i+f.w, i+f.w+1], ws = [(1-ax)*(1-ay), ax*(1-ay), (1-ax)*ay, ax*ay];

function layoutCanvases(){
  const s = map.getSize(); W=s.x; H=s.y;
  for(const cv of [fieldCv, flowCv]){
    cv.width = Math.round(W*(cv===flowCv?DPR:1)); cv.height = Math.round(H*(cv===flowCv?DPR:1));
    cv.style.width=W+"px"; cv.style.height=H+"px";

function renderField(){

      if(s){ const c = ramp(stops, s[2]); d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]= st.alpha; }
      else d[k+3]=0;

const NB = 10;
let lastFrame = 0;
function frame(ts){
  requestAnimationFrame(frame);

  if(ts-lastFrame < 30) return; lastFrame = ts;
  if(field.type==="waves"){ drawWaveCrests(); return; }
  pctx.globalCompositeOperation = "destination-in"; pctx.fillStyle = "rgba(0,0,0,0.90)"; pctx.fillRect(0,0,W,H);
  pctx.globalCompositeOperation = "source-over";

  const stops = st.stops, maxV = st.max, k = st.k, minMag = st.minMag||0;
  const paths = Array.from({length:NB},()=>new Path2D());
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    if(p.age++ > p.max){ particles[i] = newParticle(false); continue; }
    const yi = p.y|0; if(yi<0||yi>H){ particles[i]=newParticle(false); continue; }
    const s = sampleField(field, latOfY[yi], lonW + p.x*lonPerPx);
    if(!s || s[2]<minMag){ particles[i]=newParticle(false); continue; }
    const nx = p.x + s[0]*k, ny = p.y - s[1]*k;
    const b = Math.max(0, Math.min(NB-1, Math.floor(s[2]/maxV*NB))) || 0;

function drawWaveCrests(){

  const paths = Array.from({length:NB*NA},()=>new Path2D());
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    if(p.age++ > p.max){ particles[i] = newParticle(false); continue; }
    const yi = p.y|0; if(yi<0||yi>H){ particles[i]=newParticle(false); continue; }
    const s = sampleField(field, latOfY[yi], lonW + p.x*lonPerPx);
    if(!s || s[2]<0.05){ particles[i]=newParticle(false); continue; }

}

let activeKey = "wind", loadSeq = 0;
function setScale(st){
  const g = []; for(let i=0;i<=10;i++){ const v=st.min+i/10*(st.max-st.min); g.push(`${rgb(ramp(st.stops,v))} ${i*10}%`); }
  $("#scaleBar").style.background = `linear-gradient(90deg,${g.join(",")})`;
  $("#scaleLbl").innerHTML = [0,.25,.5,.75,1].map(f=>`<span>${+(st.min+f*(st.max-st.min)).toFixed(1)}</span>`).join("") + `<span>${st.unit}</span>`;
}
async function refreshModel(){
  const seq = ++loadSeq, key = activeKey, time = curTime();
  setScale(STYLES[(key==="gust"||key==="surf")?"wind":key]);
  const wantLand = key==="current"||key==="waves"||key==="temp";
  if(wantLand && !map.hasLayer(landTop)) landTop.addTo(map); else if(!wantLand && map.hasLayer(landTop)) map.removeLayer(landTop);
  $("#waterSeg").hidden = !(key==="waves"||key==="temp");
  $("#windSeg").hidden = !(key==="wind"||key==="gust");
  document.querySelectorAll("#windSeg button").forEach(b=>b.classList.toggle("on", b.dataset.w===key));
  document.querySelectorAll("#waterSeg button").forEach(b=>b.classList.toggle("on", b.dataset.w===key));
  setDot("#sMap","load","Loading forecast grid…");
  try{
    const f = await loadField(key==="surf" ? "wind" : key, time);
    if(seq!==loadSeq) return;
    field = f; $("#modelName").textContent = f.name + (key==="gust"?" · gusts":"");
    $("#note").textContent = "";
    layoutCanvases(); renderField(); seedParticles(); clearFlow(); running = true;
    setDot("#sMap","ok", `${f.name} grid · ${fmtTime(time,{weekday:"short",hour:"numeric"})}`);
    updateSummary();
    prefetch(key, time);
  }catch(e){
    if(seq!==loadSeq) return;
    field=null; renderField(); clearFlow(); updateSummary();
    const beyond = /no data/.test(e.message);
    $("#note").textContent = beyond ? "No model data for this hour (past the end of the forecast)." : "Couldn't load the forecast grid – tap ⟳ to retry.";
    setDot("#sMap", beyond?"stale":"bad", beyond?"No model data for this hour":"Forecast grid failed");
  }
}
function prefetch(key, time){ for(const h of [1]){ const t = new Date(+time+h*3600e3); if(+t <= +t0+HOURS*3600e3) loadField(key, t).catch(()=>{}); } }
function inSalishView(){ const c = map.getCenter(); return c.lat>SALISH.s && c.lat<SALISH.n && c.lng>SALISH.w && c.lng<SALISH.e; }
function setLayer(key){
  if(key==="water") key = ls.get("waterSub") || "waves";
  if(key==="windtop") key = ls.get("windSub") || "wind";
  if(key==="waves"||key==="temp") ls.set("waterSub", key);
  if(key==="wind"||key==="gust") ls.set("windSub", key);
  activeKey = key; ls.set("layer",key);
  const top = (key==="waves"||key==="temp") ? "water" : (key==="wind"||key==="gust") ? "windtop" : key;
  setTimeout(()=>{ drawTides(); }, 0);
  if(key==="surf"){ if(map.distance(map.getCenter(),[49.75,-124.95]) > 40000 || map.getZoom() < 10) map.fitBounds(SPOTS.map(sp=>[sp.lat,sp.lon]), {paddingTopLeft:[30,190], paddingBottomRight:[90,250], maxZoom:12}); if(!map.hasLayer(surfLayer)) surfLayer.addTo(map); loadSurf(); }
  else if(map.hasLayer(surfLayer)) map.removeLayer(surfLayer);
  document.querySelectorAll("#layerSeg button").forEach(b=>b.classList.toggle("on", b.dataset.l===top));
  refreshModel();
}

/* ============ timeline (wind at map centre) ============ */
let centreFc = null, centreFcRaw = null, centreCorr = null, centreTimer = null, lastCentre = null;
async function computeCorrection(){
  centreCorr = null;
  if(!$("#tCorr").checked || !obsData || !centreFcRaw) return;
  const c = map.getCenter(), now = Date.now();
  const cands = obsData.list.filter(s => s.spd!=null && now - new Date(s.t) < 100*60e3)
    .map(s => ({s, d: map.distance(c,[s.lat,s.lon])})).filter(x => x.d < 30000).sort((a,b)=>a.d-b.d);
  if(!cands.length) return;
  const {s, d} = cands[0];
  try{
    const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat.toFixed(3)}&longitude=${s.lon.toFixed(3)}&hourly=wind_speed_10m&models=gem_seamless&wind_speed_unit=kn&timezone=GMT&past_hours=3&forecast_hours=2&timeformat=unixtime`,{timeout:10000,tries:2});
    const ot = Math.round(+new Date(s.t)/3600e3)*3600, k = j.hourly.time.indexOf(ot), m = k>=0 ? j.hourly.wind_speed_10m[k] : null;
    if(m==null || (m<4 && s.spd<4)) return;
    const r = Math.max(0.6, Math.min(1.6, (s.spd+1)/(m+1)));
    centreCorr = {name:s.name, d, r, obs:s.spd, model:m, w0: Math.max(0, 1 - d/30000)};
  }catch(e){}
}
function applyCorrection(){
  if(!centreFcRaw){ centreFc = null; return; }
  const k = centreCorr;
  centreFc = centreFcRaw.map((f,i)=>{ if(!f || !k) return f; const fac = 1 + (k.r-1)*k.w0*Math.exp(-i/6); return {w:f.w*fac, g:f.g*fac, d:f.d, raw:f.w}; });
}
async function refreshCorrection(){ await computeCorrection(); applyCorrection(); drawBars(); updateSummary(); }
function scheduleCentreForecast(){ clearTimeout(centreTimer); centreTimer = setTimeout(loadCentreForecast, 700); }
async function loadCentreForecast(){
  const c = map.getCenter();
  if(lastCentre && map.distance(c,lastCentre) < 4000 && centreFcRaw) return;
  lastCentre = c;
  try{
    const j = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat.toFixed(3)}&longitude=${c.lng.toFixed(3)}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m&models=gem_seamless&wind_speed_unit=kn&timezone=GMT&forecast_days=4&timeformat=unixtime`,{timeout:12000});
    const h = j.hourly, byT = {}; h.time.forEach((t,i)=>byT[t]=i);
    centreFcRaw = Array.from({length:HOURS+1},(_,i)=>{ const t = (+t0/1000)+i*3600, k = byT[t]; return k==null?null:{w:h.wind_speed_10m[k], g:h.wind_gusts_10m[k], d:h.wind_direction_10m[k]}; });
    ls.set("centreFc",{at:Date.now(), c:[c.lat,c.lng], t0:+t0, fc:centreFcRaw});
  }catch(e){ const s = ls.get("centreFc"); if(s && s.t0===+t0) centreFcRaw = s.fc; }
  applyCorrection(); drawBars(); updateSummary();
  refreshCorrection();
}
function drawBars(){
  const bars = $("#bars"); let html = "";
  const sp = activeKey==="surf" && surfData ? (surfSel || nearestSpot()) : null, ss = sp ? surfData.res[sp.id]?.series : null;
  if(ss){ for(let i=0;i<=HOURS;i++){ const r = ss[i]; const lab = (i%4===0 && r && r.ft>=0.8) ? r.ft.toFixed(0) : "";
      html += `<div style="background:${r?starColor(r.stars):'#1d262e'}">${lab}</div>`; } }
  else for(let i=0;i<=HOURS;i++){ const f = centreFc?.[i]; const lab = (i%4===0 && f) ? Math.round(f.w) : "";
    html += `<div style="background:${f?windColor(f.w):'#1d262e'}">${lab}</div>`; }
  bars.innerHTML = html;
  let days = "";
  for(let i=0;i<=HOURS;i++){ const d = new Date(+t0+i*3600e3), hr = localHour(d), pct = (i+0.5)/(HOURS+1)*100;
    if(hr===0) days += `<span class="d" style="left:${pct}%">${fmtDay(d).split(" ")[0]}</span>`;
    else if(hr===12) days += `<span style="left:${pct}%">12</span>`; }
  $("#days").innerHTML = days;
}
function updateSummary(){
  const d = curTime(); const f = centreFc?.[tIdx];
  if(activeKey==="surf"){
    const sp = surfSel || nearestSpot(), r = surfData?.res[sp.id]?.series?.[tIdx];
    $("#sumMain").innerHTML = r ? `${sp.name.replace(/ \(.*\)/,"")} · <span style="color:${starColor(r.stars)}">${ftRange(r.ft)}</span> <span style="color:${starColor(r.stars)};font-size:12px">${starStr(r.stars)}</span>` : (surfLoading ? "Running surf model…" : "Surf model loading…");
    $("#sumSub").textContent = r ? `${fmtTime(d,{weekday:"short",hour:"numeric"})}${tIdx===0?" (now)":" · +"+tIdx+" h"} · ${r.T>0.5?r.T.toFixed(0)+" s · ":""}wind ${Math.round(r.kt)} kn ${compass(r.wdir)} ${r.state}` : "Experimental · tap a spot for details";
    $("#sumSea").hidden = true;
    const te = $("#sumTide"); te.innerHTML = r ? `<span class="tw">≈</span> ${r.ft>=0.8 ? (r.shape==="closeout"||r.shape==="mostly closing" ? r.shape : `${r.hand.toLowerCase()} ${r.shape==="point"?"off the point":r.shape}`)+" · " : ""}tide ${r.eta.toFixed(1)} m` : "";
    return;
  }
  $("#sumMain").innerHTML = f ? `<span style="color:${windColor(f.w)}">${Math.round(f.w)} kn</span> ${compass(f.d)} · gusts <span style="color:${windColor(f.g)}">${Math.round(f.g)}</span>` : "Wind forecast loading…";
  let rng = "";
  if(centreFc){ const ws = centreFc.filter(Boolean).map(x=>x.w); if(ws.length) rng = ` · ${Math.round(Math.min(...ws))}–${Math.round(Math.max(...ws))} kn next 48 h`; }
  const k = centreCorr, pct = k ? Math.round((k.r-1)*k.w0*Math.exp(-tIdx/6)*100) : 0;
  $("#sumSub").textContent = `${fmtTime(d,{weekday:"short",hour:"numeric"})}${tIdx===0?" (now)":" · +"+tIdx+" h"}${rng}`;
  if(f && k && Math.abs(pct)>=3) $("#sumMain").insertAdjacentHTML("beforeend", ` <span class="corr" title="Forecast adjusted ${pct>0?"+":""}${pct}%: model ${Math.round(k.model)} kn vs observed ${Math.round(k.obs)} kn at ${k.name}">${pct>0?"▲":"▼"}${Math.abs(pct)}% live</span>`);
  const se = $("#sumSea");
  if(field && (field.type==="waves"||field.type==="temp")){ const c = map.getCenter(); const v = sampleField(field, c.lat, c.lng);
    const onLand = field.mask ? !isWater(field.mask, c.lat, c.lng) : gridIsLand(field, c.lat, c.lng);
    if(!v || onLand) se.innerHTML = `<span class="tst">No ${field.type==="waves"?"wave":"water"} data at the crosshair (land?)</span>`;
    else if(field.type==="waves"){ const from = (Math.atan2(-v[0],-v[1])*180/Math.PI+360)%360;
      se.innerHTML = `〰 Waves <span class="sv" style="color:${waveColor(v[2])}">${v[2].toFixed(1)} m</span> · ${v[3]!=null?v[3].toFixed(0)+" s":""} from ${compass(from)}`; }
    else se.innerHTML = `🌡 Water <span class="sv" style="color:${rgb(ramp(TEMP_STOPS,v[2]))}">${v[2].toFixed(1)} °C</span> at surface`;
    se.hidden = false;
  } else { se.hidden = true; se.textContent=""; }
  const te = $("#sumTide");
  if(typeof centreTide!=="undefined" && centreTide){ const a = tideAt(centreTide,+d), nx = nextTideEvent(centreTide,+d);
    te.innerHTML = a ? `<span class="tw">${a.rising?"▲":"▼"}</span> Tide ${a.h.toFixed(1)} m ${a.rising?"rising":"falling"}${nx?` · ${nx.hi?"high":"low"} ${nx.v.toFixed(1)} m at ${fmtTime(new Date(nx.t),{hour:"numeric",minute:"2-digit"})}`:""} <span class="tst">${centreTideSt.name}</span>` : "";
  } else te.textContent = "";
}
/* ============ observed wind (ECCC SWOB) ============ */
const obsLayer = L.layerGroup().addTo(map);
let obsData = ls.get("obs") || null;
function pickNum(p, keys){ for(const k of keys){ if(p[k]!=null && p[k]!=="" && !isNaN(p[k])) return +p[k]; } return null; }
async function loadObs(){
  setDot("#sObs","load","Loading observations…");
  try{
    const since = isoZ(new Date(Date.now()-150*60e3));
    const j = await fetchJSON(`${OGC}/swob-realtime/items?f=json&limit=1000&bbox=-134.5,47.6,-122.2,55.6&_is-minutely_obs-value=false&datetime=${since}/..`,{timeout:20000});
    const by = {};
    for(const f of j.features||[]){
      const p=f.properties; const id=p["msc_id-value"]||p["stn_nam-value"]; const t=p["date_tm-value"];
      const spd = pickNum(p,["avg_wnd_spd_10m_pst10mts","avg_wnd_spd_10m_pst2mts","avg_wnd_spd_10m_pst1hr"]);
      if(spd==null) continue;
      if(!by[id] || by[id].t < t){
        by[id] = {id, name:p["stn_nam-value"], t, lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0],
          spd: spd*KMH2KT,
          gust: (v=>v==null?null:v*KMH2KT)(pickNum(p,["max_wnd_spd_10m_pst10mts","max_wnd_spd_10m_pst1hr"])),
          dir: pickNum(p,["avg_wnd_dir_10m_pst10mts","avg_wnd_dir_10m_pst2mts","avg_wnd_dir_10m_pst1hr","wnd_dir_10m_pst10mts_max_spd"]),
          sst: pickNum(p,["avg_sea_sfc_temp_pst10mts"]),
          air: pickNum(p,["air_temp","avg_air_temp_pst1hr"]),
          wave: pickNum(p,["sig_wave_hgt_pst20mts"])};
      }
    }
    obsData = {at:Date.now(), list:Object.values(by)};
    ls.set("obs", obsData);
    setDot("#sObs","ok",`${obsData.list.length} stations, updated ${fmtTime(new Date(),{hour:"numeric",minute:"2-digit"})}`);
  }catch(e){
    setDot("#sObs", obsData ? "stale":"bad", obsData ? "Observations offline – showing saved data" : "Observations failed – tap ⟳");
  }
  drawObs(); if(typeof refreshCorrection==="function" && centreFcRaw) refreshCorrection();
}
function drawObs(){
  obsLayer.clearLayers();
  if(!$("#tObs").checked || !obsData) return;
  for(const s of obsData.list){
    const kt = Math.round(s.spd), g = s.gust!=null?Math.round(s.gust):null;
    const arrow = s.dir!=null ? arrowSVG((s.dir+180)%360, windColor(s.spd), 22) : "";
    const html = `<div class="obs">${arrow}<span>${kt}${g!=null&&g>kt?"<span style='color:#ffcc80'>G"+g+"</span>":""}</span></div>`;
    L.marker([s.lat,s.lon],{pane:"marks", icon:L.divIcon({className:"", html, iconSize:[64,24], iconAnchor:[11,12]})})
      .on("click", ev=>{ L.DomEvent.stopPropagation(ev); openSpot(s.lat, s.lon, {obs:s}); })
      .addTo(obsLayer);
  }
}

/* ============ CHS tidal current stations ============ */
const curLayer = L.layerGroup().addTo(map);
let curStations = [];
const curCache = {}; // id -> {from,to,speed:[[t,v]],dir:[[t,v]],events:[]}
const queue = []; let qBusy = false;
function enqueue(fn){ return new Promise((res,rej)=>{ queue.push({fn,res,rej}); runQueue(); }); }
async function runQueue(){ if(qBusy) return; qBusy=true; while(queue.length){ const {fn,res,rej}=queue.shift(); try{ res(await fn()); }catch(e){ rej(e); } await sleep(400); } qBusy=false; } // ≤3 req/s API limit
async function loadCurStations(){
  setDot("#sCur","load","Loading tidal current stations…");
  let st = ls.get("chsStations");
  if(!st || Date.now()-st.at > 7*864e5){
    try{
      const all = await fetchJSON(`${IWLS}/stations?chs-region-code=PAC`,{timeout:20000});
      const m = s=>({id:s.id, code:s.code, name:s.officialName.trim().replace(/\b\w/g,c=>c.toUpperCase()), lat:s.latitude, lon:s.longitude});
      st = {at:Date.now(), list: all.filter(s=>s.timeSeries.some(t=>t.code==="wcsp1")).map(m), tides: all.filter(s=>s.timeSeries.some(t=>t.code==="wlp")).map(m)};
      ls.set("chsStations", st);
    }catch(e){ if(!st){ setDot("#sCur","bad","Tide & current stations failed – tap ⟳"); return; } }
  }
  curStations = st.list; tideStations = st.tides || [];
  setDot("#sCur","ok",`${tideStations.length} tide + ${curStations.length} current stations (CHS)`);
  drawCurrents(); refreshVisibleCurrents(); drawTides(); refreshVisibleTides(); loadCentreTide();
}
function cacheKeyCur(id){ return "cur:"+id+":"+t0.toISOString().slice(0,13); }
async function getCurrentSeries(s){
  if(curCache[s.id]) return curCache[s.id];
  const saved = ls.get(cacheKeyCur(s.id)); if(saved){ curCache[s.id]=saved; return saved; }
  const from = isoZ(new Date(+t0-3600e3)), to = isoZ(new Date(+t0+(HOURS+3)*3600e3));
  const q = c => `${IWLS}/stations/${s.id}/data?time-series-code=${c}&from=${from}&to=${to}`;
  const sp = await enqueue(()=>fetchJSON(q("wcsp1")));
  const dr = await enqueue(()=>fetchJSON(q("wcdp1")));
  const evFrom = isoZ(new Date(+t0-6*3600e3));
  const ev = await enqueue(()=>fetchJSON(`${IWLS}/stations/${s.id}/data?time-series-code=wcp1-events&from=${evFrom}&to=${to}`)).catch(()=>[]);
  const data = {speed:sp.map(x=>[+new Date(x.eventDate), x.value]), dir:dr.map(x=>[+new Date(x.eventDate), x.value]), events:ev.map(x=>({t:+new Date(x.eventDate), q:x.qualifier, v:x.value}))};
  curCache[s.id] = data; ls.set(cacheKeyCur(s.id), data);
  return data;
}
function interp(series, t){
  if(!series||!series.length) return null;
  for(let i=1;i<series.length;i++){ if(series[i][0]>=t){ const [ta,va]=series[i-1],[tb,vb]=series[i]; return va+(vb-va)*((t-ta)/(tb-ta||1)); } }
  return null;
}
function nearestVal(series,t){ if(!series||!series.length) return null; let b=series[0]; for(const p of series) if(Math.abs(p[0]-t)<Math.abs(b[0]-t)) b=p; return b[1]; }
const curMarkers = {};
function drawCurrents(){
  curLayer.clearLayers();
  if(!$("#tCur").checked) return;
  for(const s of curStations){
    const d = curCache[s.id]; const t = +curTime();
    let html;
    if(d){
      const v = interp(d.speed,t), dir = nearestVal(d.dir,t);
      html = v==null ? `<div class="cur">◇ –</div>` : `<div class="cur">${arrowSVG(dir??0, v<0.3?"#bbb":(v>3?"#ff5252":"#4fc3f7"), 20)}<span>${v.toFixed(1)}</span></div>`;
    } else html = `<div class="cur" style="opacity:.7">◇ ${s.name.split(" ")[0]}</div>`;
    const m = L.marker([s.lat,s.lon],{pane:"marks", icon:L.divIcon({className:"", html, iconSize:[60,22], iconAnchor:[10,11]})})
      .on("click", ev=>{ L.DomEvent.stopPropagation(ev); openStation(s); }).addTo(curLayer);
    curMarkers[s.id]=m;
  }
}
let refreshTimer=null;
function refreshVisibleCurrents(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async ()=>{
    if(!$("#tCur").checked || !curStations.length) return;
    const b = map.getBounds().pad(0.1);
    const vis = curStations.filter(s=>b.contains([s.lat,s.lon]) && !curCache[s.id]);
    if(!vis.length) return;
    setDot("#sCur","load",`Loading ${vis.length} station predictions…`);
    let fail=0;
    for(const s of vis){ try{ await getCurrentSeries(s); drawCurrents(); }catch(e){ fail++; } }
    setDot("#sCur", fail? (fail===vis.length?"bad":"stale") : "ok", fail?`${fail} stations failed to load`:`${curStations.length} CHS current stations`);
  }, 500);
}


/* ============ CHS tide heights ============ */
const tideLayer = L.layerGroup().addTo(map);
let tideStations = [];
const tideCache = {};
async function getTideSeries(s){
  if(tideCache[s.id]) return tideCache[s.id];
  const key = "tide:"+s.id+":"+t0.toISOString().slice(0,13);
  const saved = ls.get(key); if(saved){ tideCache[s.id]=saved; return saved; }
  const from = isoZ(new Date(+t0-3*3600e3)), to = isoZ(new Date(+t0+(HOURS+3)*3600e3));
  const wl = await enqueue(()=>fetchJSON(`${IWLS}/stations/${s.id}/data?time-series-code=wlp&from=${from}&to=${to}&resolution=FIFTEEN_MINUTES`));
  const hl = await enqueue(()=>fetchJSON(`${IWLS}/stations/${s.id}/data?time-series-code=wlp-hilo&from=${isoZ(new Date(+t0-12*3600e3))}&to=${to}`)).catch(()=>[]);
  const ser = wl.map(x=>[+new Date(x.eventDate), x.value]);
  if(!ser.length) throw new Error("no predictions");
  // classify hi/lo by comparing to neighbours
  const ev = hl.map(x=>({t:+new Date(x.eventDate), v:x.value}));
  ev.forEach((e,i)=>{ const nb = [ev[i-1],ev[i+1]].filter(Boolean); e.hi = nb.length ? nb.every(n=>e.v>n.v) : e.v > (interp(ser,e.t+3600e3)??e.v); });
  const data = {ser, ev};
  tideCache[s.id] = data; ls.set(key, data);
  return data;
}
function tideAt(d, t){ const v = interp(d.ser, t), v2 = interp(d.ser, t+20*60e3); return v==null?null:{h:v, rising: v2!=null ? v2>v : null}; }
function nextTideEvent(d, t){ return d.ev.find(e=>e.t>t) || null; }
function nearestTideStation(lat, lon){ let best=null, bd=1e9; for(const s of tideStations){ const dd = Math.hypot(s.lat-lat, (s.lon-lon)*Math.cos(lat*Math.PI/180)); if(dd<bd){ bd=dd; best=s; } } return best; }
function drawTides(){
  tideLayer.clearLayers();
  if(!$("#tTide").checked || map.getZoom()<9 || activeKey==="surf") return;
  const b = map.getBounds(); const t = +curTime();
  for(const s of tideStations){
    if(!b.contains([s.lat,s.lon])) continue;
    const d = tideCache[s.id]; const a = d ? tideAt(d,t) : null;
    const html = a ? `<div class="tide"><span class="tw">${a.rising?"▲":"▼"}</span>${a.h.toFixed(1)}<small>m</small></div>` : `<div class="tide dim"><span class="tw">≈</span></div>`;
    L.marker([s.lat,s.lon],{pane:"marks", icon:L.divIcon({className:"", html, iconSize:[56,20], iconAnchor:[8,10]})})
      .on("click", ev=>{ L.DomEvent.stopPropagation(ev); openTide(s); }).addTo(tideLayer);
  }
}
let tideTimer=null;
function refreshVisibleTides(){
  clearTimeout(tideTimer);
  tideTimer = setTimeout(async ()=>{
    if(!$("#tTide").checked || map.getZoom()<9 || !tideStations.length) return;
    const b = map.getBounds(), c = map.getCenter();
    const vis = tideStations.filter(s=>b.contains([s.lat,s.lon]) && !tideCache[s.id])
      .sort((a,z)=>map.distance(c,[a.lat,a.lon])-map.distance(c,[z.lat,z.lon])).slice(0,10);

let marineAreas = null, marineSel = null;
async function loadMarine(){
  try{
    const j = await fetchJSON(`${OGC}/marineweather-realtime/items?f=json&limit=300&lang=en`,{timeout:20000});
    marineAreas = j.features.filter(f=>f.properties?.area?.region?.en==="Pacific Coast" && f.geometry);

}

  const locs = f.properties.regularForecast?.locations || []; if(locs.length<=1) return locs[0]||null;
  const r = rings(f.geometry)[0]; const xs=r.map(c=>c[0]), ys=r.map(c=>c[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  const NANAIMO = 49.17;
  let best=locs[0], bs=-1e9;

    if(/north of nanaimo/.test(n)) sc += lat>NANAIMO ? 3 : -3; else if(/south of nanaimo/.test(n)) sc += lat<=NANAIMO ? 3 : -3;
    if(/\bnorth/.test(n) && !/nanaimo/.test(n)) sc += lat>cy ? 1 : -1;
    if(/\bsouth/.test(n) && !/nanaimo/.test(n)) sc += lat<=cy ? 1 : -1;

    for(const e of (l.events||[])) if(/IN EFFECT|ISSUED|CONTINUED|UPDATED/i.test(e.status?.en||"")) out.push(e.name.en); }

  try{ const c = document.createElement("canvas"); c.width=c.height=1; const g = c.getContext("2d");

      const [jw, jm] = await Promise.all([
        fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m&models=gem_seamless&wind_speed_unit=kn&timezone=GMT&forecast_days=4&timeformat=unixtime`,{timeout:12000}),
        isLandAt(lat, lon).then(land => land ? null : fetchJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_period&timezone=GMT&forecast_days=4&timeformat=unixtime`,{timeout:12000,tries:2})).catch(()=>null)]);
      j = jw; j.marine = jm?.hourly || null;
      ls.set(key,{at:Date.now(), j});
    }catch(e){ const c = ls.get(key); if(c){ j=c.j; } }
    const el = $("#spWind"); if(!el) return;
    if(!j){ el.className="err"; el.textContent="Couldn't load the wind forecast. Check signal and tap the spot again."; return; }
    el.className="strip"; el.innerHTML = windStrip(j.hourly, j.marine);
    const nowCell = el.querySelector("td.now"); if(nowCell) el.scrollLeft = Math.max(0, nowCell.offsetLeft-60);
  })();
  // ocean
  (async()=>{
    if(await isLandAt(lat, lon)){ const el = $("#spOcean"); if(el){ el.textContent = "On land – no water data here."; const t = el.previousElementSibling; if(t) t.textContent = "Water"; } return; }
    const r = await oceanAt(lat, lon, curTime()).catch(()=>null);
    const el = $("#spOcean"); if(!el) return;
    if(!r || (r.x==null && r.k==null && r.hs==null)){ el.textContent="No model water data here (on land or outside model)."; return; }
    const spd = (r.x!=null&&r.y!=null) ? Math.hypot(r.x,r.y)*MS2KT : null;
    const dir = (r.x!=null&&r.y!=null) ? (Math.atan2(r.x,r.y)*180/Math.PI+360)%360 : null;
    el.className="kv"; el.innerHTML = `<div><span>Surface current · ${fmtTime(curTime(),{weekday:"short",hour:"numeric"})}</span><b>${spd!=null?spd.toFixed(1)+" kt":"–"}</b><span>${dir!=null?"toward "+compass(dir)+" "+Math.round(dir)+"°":""}</span></div><div><span>Water temp (0.5 m)</span><b>${r.k!=null?(r.k-273.15).toFixed(1)+" °C":"–"}</b><span>${r.model}</span></div><div><span>Waves (sig. height)</span><b style="color:${r.hs!=null?waveColor(r.hs):'inherit'}">${r.hs!=null?r.hs.toFixed(1)+" m":"–"}</b><span>${r.wd!=null?"from "+compass(r.wd)+" "+Math.round(r.wd)+"°":""}</span></div><div><span>Wave period (peak)</span><b>${r.tp!=null?r.tp.toFixed(1)+" s":"–"}</b><span>RDWPS 2.5 km</span></div>`;
  })();
}
function windStrip(h, mh){
  const mIdx = {}; if(mh) mh.time.forEach((t,i)=>mIdx[t]=i);
  const now = Date.now()/1000 - 1800;
  const idx = h.time.map((t,i)=>i).filter(i=>h.time[i] >= now-3600*2);
  let days="<tr class='day'><th class='rowlab'></th>", hrs="<tr><th class='rowlab'>Local</th>", dir="<tr><td class='rowlab'>Dir</td>", w="<tr><td class='rowlab'>Wind</td>", g="<tr><td class='rowlab'>Gust</td>", wv="<tr><td class='rowlab'>Waves m</td>", wp="<tr><td class='rowlab'>Period s</td>";
  let lastDay=null, dayCells=[];
  const sel = +curTime()/1000;
  idx.forEach(i=>{
    const d = new Date(h.time[i]*1000); const dk = localDayKey(d);
    const first = dk!==lastDay; if(first){ dayCells.push([fmtDay(d),0]); lastDay=dk; }
    dayCells[dayCells.length-1][1]++;
    const cls = (first?"d ":"") + (Math.abs(h.time[i]-sel)<1800?"now":"");
    const ws=h.wind_speed_10m[i], gs=h.wind_gusts_10m[i], wd=h.wind_direction_10m[i];
    hrs += `<th class="${first?'d':''}">${fmtTime(d,{hour:"numeric"}).replace(/\s?[ap]\.?m\.?/i,m=>m.trim()[0].toLowerCase())}</th>`;
    dir += `<td class="${cls}">${wd!=null?arrowSVG((wd+180)%360,"#cfe3f3",16):""}</td>`;
    w += `<td class="${cls}" style="background:${windColor(ws)};color:#fff;font-weight:700;text-shadow:0 0 2px #000">${ws!=null?Math.round(ws):"–"}</td>`;
    g += `<td class="${cls}" style="color:${windColor(gs)};font-weight:700">${gs!=null?Math.round(gs):"–"}</td>`;
    const mi = mIdx[h.time[i]], hv = mi!=null ? mh.wave_height[mi] : null, pv = mi!=null ? mh.wave_period[mi] : null;
    wv += `<td class="${cls}" style="color:${hv!=null?waveColor(hv):'inherit'};font-weight:700">${hv!=null?hv.toFixed(1):"–"}</td>`;
    wp += `<td class="${cls}" style="color:#9fb3c1">${pv!=null?Math.round(pv):"–"}</td>`;
  });
  dayCells.forEach(([l,s],k)=> days += `<th colspan="${s}" class="${k?'d':''}" ${k?'':'style="text-align:right;padding-right:6px"'}>${l}</th>`);
  return `<table>${days}</tr>${hrs}</tr>${dir}</tr>${w}</tr>${g}</tr>${mh?wv+"</tr>"+wp+"</tr>":""}</table>`;
}

async function openStation(s){
  if(tapMarker){ map.removeLayer(tapMarker); tapMarker=null; }
  const sh = $("#sheet");
  sh.innerHTML = sheetHead(s.name, "CHS tidal current prediction (kt)") + `<div id="stBody" class="muted">Loading predictions…</div>`;
  sh.classList.add("open"); sh.scrollTop=0;
  try{
    const d = await getCurrentSeries(s); drawCurrents();
    const t = +curTime(); const v = interp(d.speed,t), dir = nearestVal(d.dir,t);
    const evs = d.events.filter(e=>e.t > Date.now()-3*3600e3).slice(0,12);
    const lab = q => q==="SLACK"?["Slack","s"]:q==="EXTREMA_FLOOD"?["Max flood","f"]:q==="EXTREMA_EBB"?["Max ebb","e"]:[q,"s"];
    let evh = ""; let lastDay=null;
    for(const e of evs){ const dt=new Date(e.t); const dk=localDayKey(dt); const [l,c]=lab(e.q);
      evh += `<div><span>${dk!==lastDay?"<b>"+fmtDay(dt)+"</b> ":""}${fmtTime(dt,{hour:"numeric",minute:"2-digit"})}</span><span class="${c}">${l}${e.q!=="SLACK"?" "+(+e.v).toFixed(1)+" kt":""}</span></div>`; lastDay=dk; }
    $("#stBody").className=""; $("#stBody").innerHTML =
      `<div class="kv"><div><span>At ${fmtTime(curTime(),{weekday:"short",hour:"numeric"})}</span><b>${v!=null?v.toFixed(1)+" kt":"–"}</b><span>${dir!=null?"toward "+compass(dir)+" "+Math.round(dir)+"°":""}</span></div><div><span>Station</span><b style="font-size:15px">${s.code}</b><span>${s.lat.toFixed(3)}, ${s.lon.toFixed(3)}</span></div></div>
       <div class="sec-t">Next 48 h</div><canvas class="spark" id="spark"></canvas>
       <div class="sec-t">Slack &amp; max times (local)</div><div class="ev">${evh||"<div class='s'>No events returned</div>"}</div>
       <div class="muted" style="padding-top:8px">Predictions from the Canadian Hydrographic Service. Not for navigation – check official tables.</div>`;
    drawSpark($("#spark"), d, t);
  }catch(e){ $("#stBody").className="err"; $("#stBody").textContent = "Couldn't load predictions ("+e.message+"). Tap the station again to retry."; }
}
function drawSpark(cv, d, sel){
  const dpr = devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const c = cv.getContext("2d"); c.scale(dpr,dpr);
  // signed: flood positive, ebb negative using events to decide sign between slacks
  const pts = d.speed.filter(p=>p[0]>=Date.now()-3600e3);
  if(!pts.length) return;
  const fl = d.events.find(e=>e.q==="EXTREMA_FLOOD");
  const floodDir = fl ? nearestVal(d.dir, fl.t) : null;
  const sgn = t => { if(floodDir==null) return 1; const dd = nearestVal(d.dir,t); const diff = Math.abs(((dd-floodDir)%360+540)%360-180); return diff<90?1:-1; };
  const vals = pts.map(p=>[p[0], p[1]*sgn(p[0])]);
  const max = Math.max(1, ...vals.map(v=>Math.abs(v[1])));
  const x = t => (t-pts[0][0])/(pts.at(-1)[0]-pts[0][0])*W, y = v => H/2 - v/max*(H/2-8);
  c.strokeStyle="#1f3d58"; c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke();
  c.fillStyle="#8fa7bd"; c.font="10px system-ui"; c.fillText("flood "+max.toFixed(1),2,10); c.fillText("ebb",2,H-2);
  c.strokeStyle="#4fc3f7"; c.lineWidth=2; c.beginPath(); vals.forEach((v,i)=> i?c.lineTo(x(v[0]),y(v[1])):c.moveTo(x(v[0]),y(v[1]))); c.stroke();
  c.strokeStyle="#ffb300"; c.beginPath(); c.moveTo(x(sel),0); c.lineTo(x(sel),H); c.stroke();
  // midnight ticks
  c.fillStyle="#8fa7bd"; for(let t=pts[0][0]; t<pts.at(-1)[0]; t+=3600e3){ const d0=new Date(t); if(fmtTime(d0,{hour:"numeric",hourCycle:"h23"})==="00"){ c.fillRect(x(t),H-6,1,6); c.fillText(fmtDay(d0),x(t)+2,H-8);} }
}

/* ============ install prompt (website only, never inside the installed app) ============ */
(function(){
  const isStandalone = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  const snoozed = () => { const t = ls.get("installSnooze"); return t && Date.now() < t; };
  const box = $("#install"), btn = $("#btnInstall");
  const hide = () => { box.hidden = true; };
  let deferred = null;
  if(isStandalone()) return;                       // running as the installed app: never prompt
  window.addEventListener("beforeinstallprompt", e => {   // Chrome/Edge/Samsung on Android
    e.preventDefault(); deferred = e;
    if(!snoozed()) setTimeout(()=>{ if(!isStandalone()) box.hidden = false; }, 2500);
  });
  window.addEventListener("appinstalled", () => { hide(); deferred = null; ls.set("installSnooze", Date.now()+3650*864e5); });
  btn.onclick = async () => {
    if(deferred){ deferred.prompt(); const r = await deferred.userChoice.catch(()=>null); deferred = null; hide();
      if(r && r.outcome==="dismissed") ls.set("installSnooze", Date.now()+7*864e5); }
    else hide();
  };
  $("#btnInstallX").onclick = () => { hide(); ls.set("installSnooze", Date.now()+14*864e5); };
  // iPhone/iPad Safari has no install event: show the manual steps instead
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(ios && !snoozed()){
    $("#installMsg").innerHTML = "Tap <b>Share</b> <span style='font-size:15px'>⎋</span> then <b>Add to Home Screen</b>.";
    btn.textContent = "OK";
    setTimeout(()=>{ box.hidden = false; }, 2500);
  }
  window.matchMedia("(display-mode: standalone)").addEventListener?.("change", e=>{ if(e.matches) hide(); });
})();
